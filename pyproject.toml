[project]
name = "orderdesk"
version = "0.1.0"
description = "Telegram order desk for small sellers: orders, courier reports and COD reconciliation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # modern Python syntax
    "B",     # likely bugs
    "SIM",   # simplifications
    "C4",    # comprehensions
    "PT",    # pytest style
    "ASYNC", # async mistakes
    "S",     # security checks
    "DTZ",   # timezone-naive datetimes
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]       # assert is the point of a test
"migrations/**" = ["S608"]  # migrations build SQL from fixed identifiers

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
