name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (restricted database role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Tests connect as orderdesk_app, which is not a superuser, owns no tables
      # and cannot bypass row-level security. The owner role only runs migrations.
      ORDERDESK_TEST_DATABASE_URL: postgresql+psycopg://orderdesk_app:app-ci-only@127.0.0.1:5432/orderdesk_test
      ORDERDESK_TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://orderdesk_owner:owner-ci-only@127.0.0.1:5432/orderdesk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Create database roles
        run: sh docker/postgres/init-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: postgres-ci-only
          POSTGRES_USER: postgres
          ORDERDESK_OWNER_PASSWORD: owner-ci-only
          ORDERDESK_APP_PASSWORD: app-ci-only
          ORDERDESK_DATABASES: orderdesk_test
      - run: uv sync --locked
      - run: uv run pytest

  compose:
    name: Docker Compose starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose up --build --detach
      - name: Wait for the health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              echo
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "The API did not become healthy in time."
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
